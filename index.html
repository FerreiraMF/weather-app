<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <main>
      <div class="form">
        <h1>Weather App</h1>
        <input type="text" placeholder="Qual é a cidade?" id="city" />
        <button>Buscar Clima</button>
      </div>
      <div class="weather-info hidden">
        <section class="weather-info-top">
          <h2 id="city-resume"></h2>
          <p id="temperature"></p>
          <p id="condition"></p>
        </section>
        <section class="weather-info-bottom">
          <div>
            <p>Umidade</p>
            <p id="humidity"></p>
          </div>
          <div>
            <p>Sensação térmica</p>
            <p id="sensation"></p>
          </div>
        </section>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
